version: "3.8"

services:
  # ==================================
  # Frontend (Next.js)
  # ==================================
  frontend:
    image: ${DOCKER_IMAGE:-ghcr.io/ilelo/profile-frontend:${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${FRONTEND_PORT:-3000}
    container_name: profile-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${FRONTEND_PORT:-3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    networks:
      - profile-network
    volumes:
      - frontend_logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:${FRONTEND_PORT:-3000}/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

# ==================================
# Networks
# ==================================
networks:
  profile-network:
    driver: bridge
    name: profile-network
    external: true

# ==================================
# Volumes
# ==================================
volumes:
  frontend_logs:
    name: profile-frontend-logs
