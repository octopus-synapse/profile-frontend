name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  deploy:
    uses: octopus-synapse/octopus-workflows/.github/workflows/cd.yml@main
    with:
      service-name: "profile-frontend"
      deploy-path: "/opt/profile-frontend"
      has-database: false
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GH_PAT }}
      SERVICE_PORT: ${{ secrets.FRONTEND_PORT }}
      OCTOPUS_SSH_PRIVATE_KEY: ${{ secrets.OCTOPUS_SSH_PRIVATE_KEY }}
      OCTOPUS_VM_HOST: ${{ secrets.OCTOPUS_VM_HOST }}
      OCTOPUS_VM_USER: ${{ secrets.OCTOPUS_VM_USER }}
      BUILD_ARGS: |
        NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
      ENV_VARS: |
        NODE_ENV=production
        FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}
        NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

  smoke-test:
    name: Smoke Test - Backend Connectivity
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify Backend is Reachable
        env:
          BACKEND_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          echo "🔍 Verifying backend connectivity..."

          # Check backend health endpoint
          for i in {1..5}; do
            if curl -sf "${BACKEND_URL}/api/health" > /dev/null; then
              echo "✅ Backend is healthy and reachable"
              exit 0
            fi
            echo "⏳ Attempt $i/5 - Backend not ready, waiting..."
            sleep 5
          done

          echo "❌ Backend unreachable at ${BACKEND_URL}/api/health"
          exit 1

      - name: Verify Frontend-Backend Integration
        env:
          FRONTEND_URL: http://${{ secrets.OCTOPUS_VM_HOST }}:${{ secrets.FRONTEND_PORT }}
          BACKEND_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          echo "🔍 Verifying frontend can reach backend..."

          # Test frontend health
          curl -sf "${FRONTEND_URL}/api/health" > /dev/null || {
            echo "❌ Frontend health check failed"
            exit 1
          }
          echo "✅ Frontend is healthy"

          # Test backend from same network perspective
          curl -sf "${BACKEND_URL}/api/health" > /dev/null || {
            echo "❌ Backend health check failed"
            exit 1
          }
          echo "✅ Backend is healthy"

          echo "🎉 Frontend-Backend integration verified!"
