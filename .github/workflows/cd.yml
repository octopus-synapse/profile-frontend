name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  deploy:
    uses: octopus-synapse/octopus-workflows/.github/workflows/cd.yml@main
    with:
      service-name: "profile-frontend"
      deploy-path: "/opt/profile-frontend"
      has-database: false
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SERVICE_PORT: ${{ secrets.FRONTEND_PORT }}
      OCTOPUS_SSH_PRIVATE_KEY: ${{ secrets.OCTOPUS_SSH_PRIVATE_KEY }}
      OCTOPUS_VM_HOST: ${{ secrets.OCTOPUS_VM_HOST }}
      OCTOPUS_VM_USER: ${{ secrets.OCTOPUS_VM_USER }}
      BUILD_ARGS: |
        NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
      ENV_VARS: |
        NODE_ENV=production
        FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}
        NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
        NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
        NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
