name: CI

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "CHANGELOG.md"
      - "package.json"
      - ".release-please-manifest.json"
      - "*.md"
      - "docs/**"

permissions:
  contents: write
  packages: read
  pull-requests: write

jobs:
  # Skip CI for release-please PRs
  should-skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: "same_content_newer"
          skip_after_successful_duplicate: "true"
          paths_ignore: '["CHANGELOG.md", "package.json", ".release-please-manifest.json", "*.md", "docs/**"]'
          do_not_skip: '["workflow_dispatch", "schedule"]'

  # Detect which parts changed
  detect-changes:
    needs: should-skip
    if: needs.should-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      apps: ${{ steps.filter.outputs.apps }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
            apps:
              - 'apps/**'
            tests:
              - 'test/**'

  # Centralized dependency setup
  setup:
    name: Setup Dependencies
    needs: should-skip
    if: needs.should-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
            apps/*/node_modules
            packages/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

  # Type check
  typecheck:
    name: Type Check
    needs: [should-skip, setup, detect-changes]
    if: |
      needs.should-skip.outputs.should_skip != 'true' &&
      (needs.detect-changes.outputs.packages == 'true' || 
       needs.detect-changes.outputs.apps == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Restore Dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
            apps/*/node_modules
            packages/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          fail-on-cache-miss: true
      - name: Type Check
        run: bun run typecheck

  # Lint
  lint:
    name: Biome Check
    needs: [should-skip, setup, detect-changes]
    if: |
      needs.should-skip.outputs.should_skip != 'true' &&
      (needs.detect-changes.outputs.packages == 'true' || 
       needs.detect-changes.outputs.apps == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Restore Dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
            apps/*/node_modules
            packages/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          fail-on-cache-miss: true
      - name: Run Biome
        run: bun run lint

  # Build packages
  build:
    name: Build Packages
    needs: [should-skip, setup, detect-changes]
    if: |
      needs.should-skip.outputs.should_skip != 'true' &&
      needs.detect-changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Restore Dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
            apps/*/node_modules
            packages/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          fail-on-cache-miss: true
      - name: Build
        run: bun run build

  # Unit tests
  unit-tests:
    name: Unit Tests
    needs: [should-skip, setup, detect-changes]
    if: |
      needs.should-skip.outputs.should_skip != 'true' &&
      (needs.detect-changes.outputs.packages == 'true' || 
       needs.detect-changes.outputs.tests == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Restore Dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
            apps/*/node_modules
            packages/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          fail-on-cache-miss: true
      - name: Run Unit Tests
        run: bun run test:unit

  # Architecture tests
  architecture-tests:
    name: Architecture Tests
    needs: [should-skip, setup, detect-changes]
    if: |
      needs.should-skip.outputs.should_skip != 'true' &&
      (needs.detect-changes.outputs.packages == 'true' || 
       needs.detect-changes.outputs.apps == 'true' ||
       needs.detect-changes.outputs.tests == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Restore Dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
            apps/*/node_modules
            packages/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          fail-on-cache-miss: true
      - name: Run Architecture Tests
        run: bun run test:arch

  # Smoke tests
  smoke-tests:
    name: Smoke Tests
    needs: [should-skip, setup, detect-changes]
    if: |
      needs.should-skip.outputs.should_skip != 'true' &&
      (needs.detect-changes.outputs.packages == 'true' || 
       needs.detect-changes.outputs.apps == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Restore Dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
            apps/*/node_modules
            packages/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          fail-on-cache-miss: true
      - name: Run Smoke Tests
        run: bun run test:smoke

  # Integration tests
  integration-tests:
    name: Integration Tests
    needs: [should-skip, setup, detect-changes]
    if: |
      needs.should-skip.outputs.should_skip != 'true' &&
      (needs.detect-changes.outputs.packages == 'true' || 
       needs.detect-changes.outputs.apps == 'true' ||
       needs.detect-changes.outputs.tests == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Restore Dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
            apps/*/node_modules
            packages/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          fail-on-cache-miss: true
      - name: Run Integration Tests
        run: bun run test:integration

  # Verify pre-commit hooks
  hook-compliance:
    name: Verify Pre-Commit Hooks
    needs: [should-skip, setup]
    if: needs.should-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Restore Dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
            apps/*/node_modules
            packages/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          fail-on-cache-miss: true
      - name: Verify lint
        run: bun run lint:fast
