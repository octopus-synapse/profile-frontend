name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  ci:
    uses: efpatti/octopus-workflows/.github/workflows/ci.yml@main
    with:
      node-version: "20"
      has-database: false
      has-redis: false
      build-output-dir: ".next"
    secrets: inherit
