name: CI

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "CHANGELOG.md"
  push:
    branches: [main, dev]
    paths-ignore:
      - "CHANGELOG.md"

permissions:
  contents: read
  pull-requests: write
  packages: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile-frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout profile-contracts
        uses: actions/checkout@v4
        with:
          repository: octopus-synapse/profile-contracts
          path: profile-contracts
          token: ${{ secrets.GH_PAT }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install contracts dependencies
        working-directory: profile-contracts
        run: bun install --frozen-lockfile

      - name: Build contracts
        working-directory: profile-contracts
        run: bun run build

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
        env:
          BUN_AUTH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Build api-client
        working-directory: frontend
        run: bun --filter @profile/api-client build

      - name: Build stores
        working-directory: frontend
        run: bun --filter @profile/stores build

      - name: Run unit tests
        working-directory: frontend
        run: bun run test:unit

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile-frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout profile-contracts
        uses: actions/checkout@v4
        with:
          repository: octopus-synapse/profile-contracts
          path: profile-contracts
          token: ${{ secrets.GH_PAT }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install contracts dependencies
        working-directory: profile-contracts
        run: bun install --frozen-lockfile

      - name: Build contracts
        working-directory: profile-contracts
        run: bun run build

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
        env:
          BUN_AUTH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Run smoke tests
        working-directory: frontend
        run: bun run test:smoke

  hook-compliance:
    name: Verify Pre-Commit Hooks Ran
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile-frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout profile-contracts
        uses: actions/checkout@v4
        with:
          repository: octopus-synapse/profile-contracts
          path: profile-contracts
          token: ${{ secrets.GH_PAT }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install contracts dependencies
        working-directory: profile-contracts
        run: bun install --frozen-lockfile

      - name: Build contracts
        working-directory: profile-contracts
        run: bun run build

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
        env:
          BUN_AUTH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Check if pre-commit hooks were bypassed
        working-directory: frontend
        run: |
          echo "🔍 Verificando se pre-commit foi executado..."

          # Type check
          if ! bun run typecheck; then
            echo "❌ TYPECHECK FALHOU - alguém usou --no-verify"
            exit 1
          fi

          # Lint
          if ! bun run lint; then
            echo "❌ LINT FALHOU - alguém usou --no-verify"
            echo "Pre-commit hooks devem ser executados antes do commit."
            exit 1
          fi

          echo "✅ Pre-commit hooks foram executados corretamente"

  lint:
    name: ESLint (Type-Aware)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile-frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout profile-contracts
        uses: actions/checkout@v4
        with:
          repository: octopus-synapse/profile-contracts
          path: profile-contracts
          token: ${{ secrets.GH_PAT }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install contracts dependencies
        working-directory: profile-contracts
        run: bun install --frozen-lockfile

      - name: Build contracts
        working-directory: profile-contracts
        run: bun run build

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
        env:
          BUN_AUTH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Run ESLint
        working-directory: frontend
        run: bun run lint

  contract-enforcement:
    name: Contract Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile-frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout profile-contracts
        uses: actions/checkout@v4
        with:
          repository: octopus-synapse/profile-contracts
          path: profile-contracts
          token: ${{ secrets.GH_PAT }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install contracts dependencies
        working-directory: profile-contracts
        run: bun install --frozen-lockfile

      - name: Build contracts
        working-directory: profile-contracts
        run: bun run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
        env:
          BUN_AUTH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Verify contracts integration
        working-directory: frontend
        run: |
          echo "🔍 Verifying contract types are properly imported..."

          # Check api-client uses contracts
          if ! grep -r "@octopus-synapse/profile-contracts" packages/api-client/src/; then
            echo "⚠️ api-client should use profile-contracts types"
          fi

          # Type check to ensure contracts are compatible
          bun run typecheck

          echo "✅ Contract enforcement passed"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit-tests, smoke-tests, hook-compliance, lint]
    steps:
      - name: Checkout profile-frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout profile-contracts
        uses: actions/checkout@v4
        with:
          repository: octopus-synapse/profile-contracts
          path: profile-contracts
          token: ${{ secrets.GH_PAT }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install contracts dependencies
        working-directory: profile-contracts
        run: bun install --frozen-lockfile

      - name: Build contracts
        working-directory: profile-contracts
        run: bun run build

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
        env:
          BUN_AUTH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Build all packages
        working-directory: frontend
        run: bun run build

      - name: Verify build output
        working-directory: frontend
        run: |
          test -d apps/web/.next || (echo "❌ Web build failed" && exit 1)
          test -d packages/api-client/dist || (echo "❌ api-client build failed" && exit 1)
          echo "✅ Build verification passed"

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            frontend/apps/web/.next
            frontend/packages/api-client/dist
            frontend/packages/stores/dist
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout profile-frontend
        uses: actions/checkout@v4
        with:
          path: profile-frontend

      - name: Checkout profile-contracts
        uses: actions/checkout@v4
        with:
          repository: octopus-synapse/profile-contracts
          path: profile-contracts
          token: ${{ secrets.GH_PAT }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: profile-frontend/Dockerfile
          push: false
          tags: profile-frontend:${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GH_PAT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
